```yaml
name: Build HyperOS Weather Widget APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build Debug APK
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Create test keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore test-release.keystore \
            -alias testkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=HyperOS Weather Widget, OU=Test, O=Jaha, L=Hue, ST=Thua Thien Hue, C=VN"

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks test-release.keystore \
            --ks-key-alias testkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify \
            --verbose \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/HyperOS-Weather-Widget-Test.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Weather-Widget-Test
          path: app/build/outputs/apk/debug/HyperOS-Weather-Widget-Test.apk
```
